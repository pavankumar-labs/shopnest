
services:

  mysql-container:
    image: mysql:8.0
    container_name: mysql-container
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: shopnest_db

    ports:
      - "3307:3306"
    volumes:
      - shopnest-mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shopnest-network


  redis-container:
    image: redis:7.2
    container_name: redis-container
    ports:
      - "6380:6379"
    networks:
      - shopnest-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5


  shopnest-app:
    build: .
    container_name: shopnest-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod

    depends_on:
        mysql-container:
          condition: service_healthy
        redis-container:
          condition: service_healthy

    networks:
      - shopnest-network

networks:
  shopnest-network:
    driver: bridge

volumes:
  shopnest-mysql-data:
