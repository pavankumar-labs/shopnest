<svg width="100%" viewBox="0 0 680 840" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ShopNest payment flow</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
.bg { fill: #F9FAFB; }
.box-gray   { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1; }
.box-blue   { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 1; }
.box-amber  { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1; }
.box-teal   { fill: #ECFDF5; stroke: #10B981; stroke-width: 1; }
.box-red    { fill: #FFF1F2; stroke: #E24B4A; stroke-width: 1; }
.box-purple { fill: #F5F3FF; stroke: #8B5CF6; stroke-width: 1; }
.th { fill: #111827; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; }
.ts { fill: #6B7280; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; }
.arr { fill: none; stroke: #9CA3AF; stroke-width: 1.5; }
.arr-red { fill: none; stroke: #E24B4A; stroke-width: 1.5; }
</style>

<rect width="680" height="840" class="bg"/>

<!-- User clicks Pay -->
<rect x="265" y="20" width="150" height="32" rx="16" class="box-gray"/>
<text class="ts" x="340" y="36" text-anchor="middle" dominant-baseline="central">User clicks Pay</text>

<line x1="340" y1="52" x2="340" y2="86" class="arr" marker-end="url(#arrow)"/>

<!-- Create Razorpay order -->
<rect x="210" y="86" width="260" height="56" rx="8" class="box-blue"/>
<text class="th" x="340" y="104" text-anchor="middle" dominant-baseline="central">Create Razorpay order</text>
<text class="ts" x="340" y="124" text-anchor="middle" dominant-baseline="central">orderId → frontend</text>

<line x1="340" y1="142" x2="340" y2="176" class="arr" marker-end="url(#arrow)"/>

<!-- Razorpay page -->
<rect x="210" y="176" width="260" height="56" rx="8" class="box-amber"/>
<text class="th" x="340" y="194" text-anchor="middle" dominant-baseline="central">Razorpay payment page</text>
<text class="ts" x="340" y="214" text-anchor="middle" dominant-baseline="central">User pays externally</text>

<!-- Split -->
<line x1="260" y1="232" x2="150" y2="266" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="232" x2="530" y2="266" class="arr" marker-end="url(#arrow)"/>

<!-- Webhook branch -->
<line x1="560" y1="204" x2="614" y2="204" stroke="#9CA3AF" stroke-width="1"/>
<line x1="614" y1="204" x2="614" y2="318" stroke="#9CA3AF" stroke-width="1"/>
<line x1="614" y1="318" x2="502" y2="318" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="626" y="265" text-anchor="start">webhook</text>

<!-- LEFT header -->
<rect x="60" y="266" width="180" height="36" rx="8" class="box-gray"/>
<text class="th" x="150" y="284" text-anchor="middle" dominant-baseline="central">Backend</text>

<!-- RIGHT header -->
<rect x="440" y="266" width="180" height="36" rx="8" class="box-gray"/>
<text class="th" x="530" y="284" text-anchor="middle" dominant-baseline="central">Razorpay webhook</text>

<line x1="150" y1="302" x2="150" y2="336" class="arr" marker-end="url(#arrow)"/>
<line x1="530" y1="302" x2="530" y2="336" class="arr" marker-end="url(#arrow)"/>

<!-- LEFT idempotency -->
<rect x="40" y="336" width="220" height="56" rx="8" class="box-amber"/>
<text class="th" x="150" y="354" text-anchor="middle" dominant-baseline="central">Already SUCCESS?</text>
<text class="ts" x="150" y="374" text-anchor="middle" dominant-baseline="central">Idempotency check</text>

<!-- RIGHT idempotency -->
<rect x="420" y="336" width="220" height="56" rx="8" class="box-amber"/>
<text class="th" x="530" y="354" text-anchor="middle" dominant-baseline="central">Already SUCCESS?</text>
<text class="ts" x="530" y="374" text-anchor="middle" dominant-baseline="central">Idempotency check</text>

<!-- LEFT yes skip -->
<line x1="40" y1="364" x2="14" y2="364" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="2" y="378" width="90" height="36" rx="8" class="box-gray"/>
<text class="ts" x="47" y="396" text-anchor="middle" dominant-baseline="central">Skip — done</text>

<!-- RIGHT yes skip -->
<line x1="640" y1="364" x2="658" y2="364" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="588" y="378" width="90" height="36" rx="8" class="box-gray"/>
<text class="ts" x="633" y="396" text-anchor="middle" dominant-baseline="central">Skip — done</text>

<line x1="150" y1="392" x2="150" y2="436" class="arr" marker-end="url(#arrow)"/>
<line x1="530" y1="392" x2="530" y2="436" class="arr" marker-end="url(#arrow)"/>

<!-- LEFT verify -->
<rect x="40" y="436" width="220" height="56" rx="8" class="box-blue"/>
<text class="th" x="150" y="454" text-anchor="middle" dominant-baseline="central">Verify signature</text>
<text class="ts" x="150" y="474" text-anchor="middle" dominant-baseline="central">HMAC check</text>

<!-- RIGHT verify -->
<rect x="420" y="436" width="220" height="56" rx="8" class="box-blue"/>
<text class="th" x="530" y="454" text-anchor="middle" dominant-baseline="central">Verify signature</text>
<text class="ts" x="530" y="474" text-anchor="middle" dominant-baseline="central">HMAC check</text>

<!-- LEFT sig fail -->
<line x1="40" y1="464" x2="4" y2="464" class="arr-red" marker-end="url(#arrow-red)"/>
<rect x="2" y="478" width="110" height="56" rx="8" class="box-red"/>
<text class="th" x="57" y="496" text-anchor="middle" dominant-baseline="central">Sig invalid</text>
<text class="ts" x="57" y="516" text-anchor="middle" dominant-baseline="central">Order CANCELLED</text>

<!-- RIGHT sig fail -->
<line x1="640" y1="464" x2="666" y2="464" class="arr-red" marker-end="url(#arrow-red)"/>
<rect x="568" y="478" width="110" height="56" rx="8" class="box-red"/>
<text class="th" x="623" y="496" text-anchor="middle" dominant-baseline="central">Sig invalid</text>
<text class="ts" x="623" y="516" text-anchor="middle" dominant-baseline="central">Rejected only</text>

<line x1="150" y1="492" x2="150" y2="546" class="arr" marker-end="url(#arrow)"/>
<line x1="530" y1="492" x2="530" y2="546" class="arr" marker-end="url(#arrow)"/>

<!-- LEFT success -->
<rect x="40" y="546" width="220" height="56" rx="8" class="box-teal"/>
<text class="th" x="150" y="564" text-anchor="middle" dominant-baseline="central">Payment → SUCCESS</text>
<text class="ts" x="150" y="584" text-anchor="middle" dominant-baseline="central">Order → CONFIRMED</text>

<!-- RIGHT success -->
<rect x="420" y="546" width="220" height="56" rx="8" class="box-teal"/>
<text class="th" x="530" y="564" text-anchor="middle" dominant-baseline="central">Payment → SUCCESS</text>
<text class="ts" x="530" y="584" text-anchor="middle" dominant-baseline="central">Order → CONFIRMED</text>

<!-- Converge -->
<line x1="150" y1="602" x2="290" y2="656" class="arr" marker-end="url(#arrow)"/>
<line x1="530" y1="602" x2="390" y2="656" class="arr" marker-end="url(#arrow)"/>

<!-- Email -->
<rect x="190" y="656" width="300" height="56" rx="8" class="box-purple"/>
<text class="th" x="340" y="674" text-anchor="middle" dominant-baseline="central">Confirmation email</text>
<text class="ts" x="340" y="694" text-anchor="middle" dominant-baseline="central">Async — fires once only</text>

</svg>
