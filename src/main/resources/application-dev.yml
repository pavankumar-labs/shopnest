spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopnest_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

  jpa:
    show-sql: true
    properties:
      hibernate:
        ddl-auto: none
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.shopnest: DEBUG
    org.hibernate.SQL: DEBUG