spring:
  application:
    name: shopnest-ecommerce-backend
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cache:
    redis:
      cache-null-values: false
    type: redis

  data:
    redis:
      timeout: 6000
      connect-timeout: 6000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
brevo:
  api:
    key: ${BREVO_API_KEY}
    base-url: https://api.brevo.com/v3
  sender:
    email: ${BREVO_SENDER_EMAIL}
    name: ${BREVO_SENDER_NAME}





server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /api-docs


razorpay:
  key:
    id: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}
  currency: INR
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET}
  api:
    base-url: https://api.razorpay.com/v1
management:
  endpoints:
    web:
      base-path: /actuator
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework: INFO


scheduler:
  rate-ms: 90000
  cutoff-minutes: 15
  refund-reconciliation-delay-ms: 3600000

app:
  frontend-url: ${APP_FRONTEND_URL}