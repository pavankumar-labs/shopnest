spring:
  datasource:
    url: jdbc:mysql://mysql-container:3306/shopnest_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

  jpa:
    show-sql: false

    hibernate:
      ddl-auto: update
  data:
    redis:
      host: redis-container
      port: 6379

logging:
  level:
    com.shopnest: INFO
    org.hibernate.SQL: ERROR