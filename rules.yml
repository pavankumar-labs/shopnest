groups:
  - name: shopnest_alerts
    rules:
      - alert: ShopNestDown
        expr: up{job="shopnest-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ShopNest App is DOWN"
          description: "The Sentinel cannot reach the ShopNest backend."

      - alert: DatabaseConnectionError
        expr: hikaricp_connections_pending{pool="HikariPool-1"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database unreachable by ShopNest"
          description: "Hikari pool has 0 active connections."


      - alert: JVMMemoryHigh
        expr: (sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"})) > 0.85
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "JVM Memory Leak Warning"
          description: "Heap above 85% for 5 minutes. GC may be failing."

      - alert: RedisConnectionError
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis Cache is DOWN"
          description: "ShopNest lost connection to Redis container."

      - alert: BruteForceDetected
        expr: rate(http_server_requests_seconds_count{status="401", job="shopnest-app"}[5m]) > 0.5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Brute Force Attack Detected!"
          description: "High 401 rate. Someone may be attacking ShopNest login."

